function setCustomZ(z){vib();customZ=z;document.querySelectorAll('#zp button').forEach(b=>b.classList.toggle('on',+b.dataset.z===z));calcEquivalent()}
function calcEquivalent(){
  let formula=document.getElementById('molarInput').value.trim(),resBox=document.getElementById('molarRes');
  if(!formula){resBox.innerHTML='Введи формулу (например: <b>H2SO4</b>, <b>Ca(OH)2</b>, <b>Al2O3</b>) — расчёт появится мгновенно.';return;}
  try{
    const massMap={};ELEMENTS.forEach(e=>massMap[e[1]]=e[3]);
    function parseGroup(str){
      let stack=[{}],i=0;
      while(i<str.length){
        if(str[i]==='('){stack.push({});i++;}
        else if(str[i]===')'){
          i++;let numStr='';while(i<str.length&&/\d/.test(str[i])){numStr+=str[i];i++;}
          let mult=numStr?parseInt(numStr,10):1,top=stack.pop(),curr=stack[stack.length-1];
          for(let k in top)curr[k]=(curr[k]||0)+top[k]*mult;
        }else if(/[A-Z]/.test(str[i])){
          let sym=str[i];i++;while(i<str.length&&/[a-z]/.test(str[i])){sym+=str[i];i++;}
          let numStr='';while(i<str.length&&/\d/.test(str[i])){numStr+=str[i];i++;}
          let count=numStr?parseInt(numStr,10):1,curr=stack[stack.length-1];
          curr[sym]=(curr[sym]||0)+count;
        }else i++;
      }
      return stack[0];
    }
    let counts=parseGroup(formula),keys=Object.keys(counts);
    if(!keys.length){resBox.innerText='Введи корректную формулу (заглавными буквами)';return;}
    let totalM=0;
    for(let sym of keys){
      if(!massMap[sym]){resBox.innerHTML=`❌ Неизвестный элемент: <b>${sym}</b>`;return;}
      totalM+=massMap[sym]*counts[sym];
    }
    let z=1,typeDesc='Вещество';
    if(customZ>0){z=customZ;typeDesc=`Ручной выбор (z = ${z})`;}
    else if(keys.length===1){let sym=keys[0],v=VALENCES[sym]||1;z=v*counts[sym];typeDesc=`Простое в-во / Элемент (валентность ≈ ${v})`;}
    else if(formula==='H2O'||formula==='H2O2'){z=2;typeDesc='Оксид водорода (z = 2)';}
    else if(formula.includes('OH')){let m=formula.match(/\(OH\)(\d+)/);z=m?parseInt(m[1],10):1;typeDesc=`Основание / Гидроксид (групп OH⁻: ${z})`;}
    else if(formula.startsWith('H')&&counts['H']){z=counts['H'];typeDesc=`Кислота (основность H⁺: ${z})`;}
    else if(keys.length===2&&counts['O']){z=counts['O']*2;typeDesc=`Оксид (суммарный заряд O²⁻: ${z})`;}
    else{
      let firstEl=keys[0];
      if(formula.includes('SO4')||formula.includes('SO3')||formula.includes('CO3')||formula.includes('SiO3')){let m=formula.match(/\((SO4|SO3|CO3|SiO3)\)(\d+)/);z=(m?parseInt(m[2],10):1)*2;}
      else if(formula.includes('PO4')){let m=formula.match(/\(PO4\)(\d+)/);z=(m?parseInt(m[1],10):1)*3;}
      else{z=counts[firstEl]*(VALENCES[firstEl]||1);}
      typeDesc=`Соль / Соединение (z = ${z})`;
    }
    let mEq=totalM/z,fEq=z===1?'1':`1/${z} (${(1/z).toFixed(2)})`;
    resBox.innerHTML=`<div>🧪 <b>Тип:</b> ${typeDesc}</div><div>⚖️ <b>Молярная масса (M):</b> <span style="color:var(--prac)">${totalM.toFixed(2)} г/моль</span></div><div>🔢 <b>Фактор эквивалентности (f<sub>экв</sub>):</b> ${fEq}</div><div>🎯 <b>Масса эквивалента (M<sub>экв</sub>):</b> <span style="color:var(--a);font-size:.95rem">${mEq.toFixed(2)} г/моль</span></div>`;
  }catch(e){resBox.innerText='Проверь правильность написания скобок и индексов';}
}
