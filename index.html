 case 'day':setDay(value);break;case 'subgroup':setSubgroup(value);break;
 case 'week':openModal('week');break;case 'selectWeek':setWeek(value);closeModal();break;case 'currentWeek':setWeek(currentWeek());closeModal();break;
 case 'today':state.query='';$('lessonSearch').value='';setWeek(currentWeek());setDay(Math.min(today(),6));break;
 case 'search':$('searchBox').hidden=!$('searchBox').hidden;if(!$('searchBox').hidden)$('lessonSearch').focus();break;
 case 'clearSearch':state.query='';$('lessonSearch').value='';renderCards(true);$('summaryTitle').textContent=localeDate(dateOf(state.week,state.day));break;
 case 'expand':{const rows=matchingRows();const row=rows[+target.dataset.index];state.openCard=row&&state.openCard!==rowId(row)?rowId(row):-1;renderCards();$('cards').querySelector(`[data-index="${target.dataset.index}"]`)?.focus({preventScroll:true});break}
 case 'share':{const text=scheduleText();if(navigator.share)try{await navigator.share({title:t('app'),text})}catch{}else await copyText(text);break}
 case 'copy':await copyText(scheduleText());break;case 'copyText':await copyText(value);break;
 case 'notes':case 'teachers':case 'bells':case 'offline':openModal(action);break;
 case 'install':if(installPrompt){const prompt=installPrompt;installPrompt=null;try{await prompt.prompt();await prompt.userChoice}catch{}if(state.modal==='offline')renderModal()}break;
 case 'deleteNote':del(value);toast(t('deleted'));renderModal();renderCards();break;
 case 'download':download();break;
 }
});
document.addEventListener('input',event=>{if(event.target.id==='lessonSearch'){state.query=event.target.value;state.openCard=-1;renderCards(true);$('summaryTitle').textContent=state.query?t('search'):localeDate(dateOf(state.week,state.day))}
 else if(event.target.id==='groupSearch'){state.groupQuery=event.target.value;renderGroupChoices()}
 else if(event.target.id==='teacherSearch'){state.teacherQuery=event.target.value;renderTeacherChoices()}
 else if(event.target.id==='noteText'){const row=matchingRows()[+event.target.dataset.noteIndex];if(row){const value=event.target.value.trim();value?save(noteKey(row),value):del(noteKey(row))}}
});
$('modal').addEventListener('click',event=>{if(event.target===$('modal'))closeModal()});
document.addEventListener('keydown',event=>{
 const overlay=!$('onboard').hidden?$('onboard'):!$('modal').hidden?$('modal'):null;if(!overlay)return;
 if(event.key==='Escape'&&overlay===$('modal')){event.preventDefault();closeModal();return}
 if(event.key==='Tab'){const items=[...overlay.querySelectorAll('button:not([disabled]),input,select,textarea,a[href],[tabindex="0"]')].filter(el=>!el.hidden&&el.getClientRects().length);if(!items.length)return;const first=items[0],last=items[items.length-1];if(event.shiftKey&&(document.activeElement===first||!items.includes(document.activeElement))){event.preventDefault();last.focus()}else if(!event.shiftKey&&(document.activeElement===last||!items.includes(document.activeElement))){event.preventDefault();first.focus()}}
});
const brandImage=$('brandIcon');brandImage.addEventListener('load',()=>{brandImage.hidden=false;$('brandFallback').hidden=true});brandImage.addEventListener('error',()=>{brandImage.hidden=true;$('brandFallback').hidden=false});brandImage.src='./icon.png';
render(true);
if(!state.languageChosen){$('onboardLanguages').innerHTML=Object.entries(LANGUAGES).map(([code,name])=>`<button data-action="setLanguage" data-value="${code}">${esc(name)}<small>${esc(I18N[code].app)}</small></button>`).join('');$('onboard').hidden=false;syncOverlays()}
setupOffline();
let lastScheduleMinute='',lastCalendarDay='',trackedWeek=currentWeek(),trackedDay=today();
function tick(){
 if(document.hidden)return;
 renderStatus();const c=ufaClock(),calendar=`${c.year}-${c.month}-${c.day}`,stamp=`${calendar} ${c.hour}:${c.minute}`;
 if(lastCalendarDay&&calendar!==lastCalendarDay){if(state.week===trackedWeek&&state.day===Math.min(trackedDay,6)){state.week=currentWeek();state.day=Math.min(today(),6)}trackedWeek=currentWeek();trackedDay=today();render()}
 if(stamp!==lastScheduleMinute){lastScheduleMinute=stamp;if(document.activeElement?.id!=='noteText')renderCards()}
 lastCalendarDay=calendar;
}
setInterval(tick,1000);document.addEventListener('visibilitychange',()=>{document.body.classList.toggle('animations-paused',document.hidden);if(!document.hidden){tick();refreshOfflineHint()}});




</script>
</body></html>
