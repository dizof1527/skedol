/* Comfortable typography, clear controls and vivid theme accents. */
:root{--text-scale:1}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html[data-text-size=large]{--text-scale:1.15}
html[data-theme=graphite]{--bg:#0c1118;--s:#151e2b;--s2:#223046;--t:#f6f9ff;--m:#b2c0d4;--l:#35465f;--a:#b6fa4b;--ao:#162300;--lec:#93b4ff;--prac:#4ae6b0}
body{font-size:calc(16px * var(--text-scale));line-height:1.55}
a{color:var(--a)}
button,a,input,textarea{ -webkit-tap-highlight-color:transparent }
.nav-item{font-size:calc(14px * var(--text-scale));min-height:48px}
.brand-subtitle,.nav-label,.sidebar-note,.workspace-foot{font-size:12px}
.eyebrow{font-size:11px;letter-spacing:.07em}
.header .icon{width:44px;height:44px;min-width:44px}
.header-actions{gap:8px}
.support-shortcut{color:var(--a);border-color:color-mix(in srgb,var(--a) 45%,var(--l));background:color-mix(in srgb,var(--a) 8%,var(--s))}
.utility-strip{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:-15px 0 25px}
.data-info{color:var(--m);font-size:12px;line-height:1.5;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.utility-actions{display:flex;gap:8px}
.quick-today,.install-shortcut{display:flex;align-items:center;justify-content:center;gap:7px;padding:8px 12px;min-height:44px;border-radius:12px;border:1px solid var(--l);background:var(--s);font-size:13px;font-weight:650}
.quick-today .ui-icon,.install-shortcut .ui-icon{width:18px;height:18px}
.install-shortcut{color:var(--ao);background:var(--a);border-color:var(--a)}
.group-copy strong{font-size:calc(20px * var(--text-scale));font-weight:700}
.group-copy small{font-size:calc(13px * var(--text-scale))}
.group-switch{min-height:48px}
.group-monogram{width:48px;height:48px;background:color-mix(in srgb,var(--a) 13%,var(--s));border:1px solid color-mix(in srgb,var(--a) 25%,var(--l))}
.weekbar button{min-width:44px;min-height:44px}
.weekbar .week-title{font-size:14px;line-height:1.45}
.week-title .week-type{font-size:12px}
.quick-groups{display:flex;gap:8px;overflow-x:auto;scrollbar-width:thin;overscroll-behavior-x:contain;padding:0 0 14px;margin-top:-8px}
.quick-group{flex:none;display:flex;align-items:center;gap:7px;border:1px solid var(--l);border-radius:24px;padding:8px 13px;min-height:44px;background:var(--s);font-size:13px;font-weight:600}

 const surface=$('appShell');
 surface.addEventListener('touchstart',event=>{
  surfaceIgnoreUntil=0;
  if(event.touches.length!==1||!event.target.closest('.agenda,.day-nav')||event.target.closest('input,textarea,select,.subgroup-tools'))return;
  swipe={x:event.touches[0].clientX,y:event.touches[0].clientY,at:performance.now()};
 },{passive:true});
 surface.addEventListener('touchend',event=>{
  if(!swipe)return;const start=swipe;swipe=null;if(!event.changedTouches.length)return;
  const touch=event.changedTouches[0],dx=touch.clientX-start.x,dy=touch.clientY-start.y;
  if(performance.now()-start.at>1000||Math.abs(dx)<65||Math.abs(dx)<Math.abs(dy)*1.7)return;
  surfaceIgnoreUntil=performance.now()+350;moveDay(dx<0?1:-1);
 },{passive:true});
 surface.addEventListener('touchcancel',()=>{swipe=null},{passive:true});
 surface.addEventListener('click',event=>{if(performance.now()<surfaceIgnoreUntil){event.preventDefault();event.stopImmediatePropagation()}},true);
 $('dayNav').addEventListener('keydown',event=>{if(!['ArrowLeft','ArrowRight'].includes(event.key))return;event.preventDefault();moveDay(event.key==='ArrowRight'?1:-1);$('dayNav').querySelector('[aria-pressed="true"]')?.focus()});
}
function moveDay(direction){
 if(state.query){state.query='';$('lessonSearch').value=''}
 let day=state.day+direction,week=state.week;
 if(day>6){if(week>=MAX_WEEK)return;day=1;week++}else if(day<1){if(week<=1)return;day=6;week--}
 state.week=week;setDay(day);
}

const initialChanges=inspectScheduleChanges();
initializeGestures();
setInterval(checkNewVersion,300000);
if('serviceWorker' in navigator)navigator.serviceWorker.addEventListener('message',event=>{if(event.data?.type==='OPEN_SCHEDULE_CHANGES')openModal('updates')});
if(new URLSearchParams(location.search).get('changes')==='1'&&state.languageChosen){setTimeout(()=>openModal('updates'),350);history.replaceState(null,'',location.pathname+location.hash)}
window.addEventListener('online',checkNewVersion);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkNewVersion()});

const brandImage=$('brandIcon');brandImage.addEventListener('load',()=>{brandImage.hidden=false;$('brandFallback').hidden=true});brandImage.addEventListener('error',()=>{brandImage.hidden=true;$('brandFallback').hidden=false});brandImage.src='./icon.png';
render(true);
if(!state.languageChosen){$('onboardLanguages').innerHTML=languageChoices();$('onboard').hidden=false;syncOverlays()}
setupOffline();
let lastScheduleMinute='',lastCalendarDay='',trackedWeek=currentWeek(),trackedDay=today();
function tick(){
 if(document.hidden)return;
 renderStatus();const c=ufaClock(),calendar=`${c.year}-${c.month}-${c.day}`,stamp=`${calendar} ${c.hour}:${c.minute}`;
 if(lastCalendarDay&&calendar!==lastCalendarDay){if(state.week===trackedWeek&&state.day===Math.min(trackedDay,6)){state.week=currentWeek();state.day=Math.min(today(),6)}trackedWeek=currentWeek();trackedDay=today();render()}
 if(stamp!==lastScheduleMinute){lastScheduleMinute=stamp;if(document.activeElement?.id!=='noteText')renderCards()}
 lastCalendarDay=calendar;
}
setInterval(tick,1000);document.addEventListener('visibilitychange',()=>{document.body.classList.toggle('animations-paused',document.hidden);if(!document.hidden){tick();refreshOfflineHint()}});




</script>
