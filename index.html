/* Comfortable typography, clear controls and vivid theme accents. */
:root{--text-scale:1}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-size:calc(16px * var(--text-scale));line-height:1.55}
a{color:var(--a)}
button,a,input,textarea{ -webkit-tap-highlight-color:transparent }
.nav-item{font-size:calc(14px * var(--text-scale));min-height:48px}
.brand-subtitle,.nav-label,.sidebar-note,.workspace-foot{font-size:12px}
.eyebrow{font-size:11px;letter-spacing:.07em}
.header .icon{width:44px;height:44px;min-width:44px}
.header-actions{gap:8px}
.support-shortcut{color:var(--a);border-color:color-mix(in srgb,var(--a) 45%,var(--l));background:color-mix(in srgb,var(--a) 8%,var(--s))}
.utility-strip{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:-15px 0 25px}
.data-info{color:var(--m);font-size:12px;line-height:1.5;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.utility-actions{display:flex;gap:8px}
.quick-today,.install-shortcut{display:flex;align-items:center;justify-content:center;gap:7px;padding:8px 12px;min-height:44px;border-radius:12px;border:1px solid var(--l);background:var(--s);font-size:13px;font-weight:650}
.quick-today .ui-icon,.install-shortcut .ui-icon{width:18px;height:18px}
.install-shortcut{color:var(--ao);background:var(--a);border-color:var(--a)}
.group-copy strong{font-size:calc(20px * var(--text-scale));font-weight:700}
.group-copy small{font-size:calc(13px * var(--text-scale))}
.group-switch{min-height:48px}
.group-monogram{width:48px;height:48px;background:color-mix(in srgb,var(--a) 13%,var(--s));border:1px solid color-mix(in srgb,var(--a) 25%,var(--l))}
.weekbar button{min-width:44px;min-height:44px}
.weekbar .week-title{font-size:14px;line-height:1.45}
.week-title .week-type{font-size:12px}
.quick-groups{display:flex;gap:8px;overflow-x:auto;scrollbar-width:thin;overscroll-behavior-x:contain;padding:0 0 14px;margin-top:-8px}
.quick-group{flex:none;display:flex;align-items:center;gap:7px;border:1px solid var(--l);border-radius:24px;padding:8px 13px;min-height:44px;background:var(--s);font-size:13px;font-weight:600}
.quick-group .ui-icon{width:16px;height:16px;color:var(--a)}
.quick-group.on{border-color:var(--a);background:color-mix(in srgb,var(--a) 14%,var(--s))}
.day-nav button{min-height:100px;background:var(--s);padding:12px 2px 10px}
.day-nav button>span:first-child{font-size:12px;font-weight:700}
.day-nav small{font-size:29px;font-weight:600}
.day-dots{gap:3px;max-width:100%;flex-wrap:wrap;min-height:8px;height:auto}
.day-dots i{width:4px;height:4px}
.today-beacon{width:5px;height:5px;top:8px;right:7px}
.agenda-heading{flex-wrap:wrap;gap:15px}
.summary h2{font-size:calc(24px * var(--text-scale));font-weight:650}
.summary span{font-size:14px}
.subgroup-tools{display:flex;gap:8px;align-items:center;max-width:100%}
.subgroups{border-radius:13px;min-width:0;background:var(--s)}
.subgroups button{min-height:44px;font-size:calc(13px * var(--text-scale));padding:9px 12px;line-height:1.3}
.subgroups button.on{background:var(--a);color:var(--ao);box-shadow:0 3px 12px color-mix(in srgb,var(--a) 16%,transparent)}
.remember-filter{width:46px;min-width:46px;height:50px;border-radius:13px;border:1px solid var(--l);background:var(--s);display:grid;place-items:center;color:var(--m)}
.remember-filter[aria-pressed=true]{color:var(--a);border-color:var(--a);background:color-mix(in srgb,var(--a) 10%,var(--s))}
.filter-summary{font-size:calc(13px * var(--text-scale));color:var(--m);padding:0 2px;margin:-4px 0 18px;line-height:1.6}
.card{border-radius:20px;box-shadow:0 7px 24px #00000012;background:linear-gradient(125deg,color-mix(in srgb,var(--class-color) 5%,var(--s)),var(--s) 80%);border-color:color-mix(in srgb,var(--class-color) 24%,var(--l))}
.card.past{opacity:1}
.card-button{padding:22px 20px;grid-template-columns:75px minmax(0,1fr) 18px;gap:18px;min-height:160px}
.card-button:before{width:4px;top:22px;bottom:22px;background:linear-gradient(180deg,var(--class-color),color-mix(in srgb,var(--class-color) 22%,transparent))}
.time-block b{font-size:calc(21px * var(--text-scale));font-weight:700;letter-spacing:-.025em}
.time-block small{font-size:calc(14px * var(--text-scale))}
.pair-no{font-size:calc(12px * var(--text-scale));padding-top:18px}
.title{font-size:calc(20px * var(--text-scale));font-weight:650;line-height:1.4;letter-spacing:-.02em}
.lesson-body{gap:11px}
.lesson-type,.lesson-live{font-size:calc(11px * var(--text-scale));line-height:1.5;letter-spacing:.03em;font-weight:700;padding:3px 8px;border-radius:7px}
.lesson-type{background:color-mix(in srgb,var(--class-color) 16%,var(--s));border-color:color-mix(in srgb,var(--class-color) 38%,var(--l))}
.lesson-top .subgroup-label{font-size:calc(12px * var(--text-scale));font-weight:650;color:var(--t);background:var(--s2);padding:4px 7px;border-radius:7px}
.lesson-meta{font-size:calc(14px * var(--text-scale));gap:7px 14px;line-height:1.6}
.lesson-meta .ui-icon{width:16px;height:16px}
.card-chevron .ui-icon{width:18px;height:18px}
.detail{margin-left:114px;padding:5px 0 22px}
.detail p,.detail label{font-size:calc(14px * var(--text-scale));line-height:1.65}
.detail input,.input,.search-field input{font-size:calc(16px * var(--text-scale));min-height:48px}
.detail p b{font-weight:600}
.agenda-end{font-size:12px;opacity:1}
.status b{font-size:calc(14px * var(--text-scale));font-weight:650;line-height:1.5}
.status small{font-size:calc(15px * var(--text-scale));line-height:1.5}
.countdown-row strong,.status-clock{font-size:44px;font-weight:600}
.countdown-row span,.ufa-time{font-size:12px}
.status-progress{height:5px}
.current-panel{border-color:color-mix(in srgb,var(--a) 60%,var(--l));background:linear-gradient(125deg,color-mix(in srgb,var(--a) 14%,var(--s)),var(--s) 85%)}
.section-overline,.week-chart .bar-count,.week-chart small,.week-panel .week-caption{font-size:12px}
.week-panel h3,.week-stat span,.notes-cta strong{font-size:15px}
.notes-cta small,.current-panel .text-link{font-size:13px}
.offline-pill{font-size:12px;min-height:44px}
.panel{width:min(100%,680px)}
.panel-head{gap:14px}
.panel-head h2{font-size:calc(27px * var(--text-scale));font-weight:650;line-height:1.3}

const teacherDirectoryCache=new Map();
const normalizeTeacherText=value=>String(value??'').normalize('NFKC').toLocaleLowerCase('ru-RU').replace(/ё/g,'е').replace(/[^\p{L}\p{N}]/gu,'');
const teacherNameKey=value=>normalizeTeacherText(String(value).trim().replace(/^(?:ст\.\s*преп\.?|доц\.?|проф\.?|асс\.?|преп\.?)\s*/i,''));
function allTeachers(){
 if(teacherDirectoryCache.has(state.lang))return teacherDirectoryCache.get(state.lang);
 const people=new Map();
 for(const [group,rows] of Object.entries(DATA.groups))for(const row of rows){
  const original=DATA.teachers[row[5]]||'';
  if(!original||/^(?:Куратор|Преподаватели|вакансия)/i.test(original))continue;
  const rawNames=original.split(/[,;]/),names=teacher(row).split(/[,;]/);
  rawNames.forEach((rawName,i)=>{
   rawName=rawName.trim();const key=teacherNameKey(rawName);if(!key)return;
   let person=people.get(key);
   if(!person){person={key,name:names[i]?.trim()||rawName,original:rawName,groups:new Set(),subjects:new Set(),originalSubjects:new Set(),searchNames:new Set(),entries:[]};people.set(key,person)}
   person.groups.add(group);person.subjects.add(subject(row));person.originalSubjects.add(DATA.subjects[row[3]]);
   person.searchNames.add(rawName);person.searchNames.add(names[i]?.trim()||rawName);
   for(const translations of Object.values(TEACHER_TRANSLATIONS))person.searchNames.add((translations[row[5]]||'').split(/[,;]/)[i]?.trim()||'');
   person.entries.push({group,row,multipleTeachers:rawNames.length>1});
  });
 }
 const result=[...people.values()].sort((a,b)=>a.original.localeCompare(b.original,'ru',{numeric:true}));teacherDirectoryCache.set(state.lang,result);return result;
}
function teacherMatches(person,query){

 const text=normalizeTeacherText([...person.searchNames,...person.subjects,...person.originalSubjects,...[...person.groups].flatMap(key=>[DATA.labels[key],key])].join(' '));
 return tokens.every(token=>text.includes(token));
}

async function notifyScheduleChanges(changes){
 const items=changes.filter(item=>item.group===state.group);
 if(!items.length||!state.notifications||!('Notification' in window)||Notification.permission!=='granted'||!('serviceWorker' in navigator))return;
 try{const registration=await navigator.serviceWorker.getRegistration();if(registration?.active)await registration.showNotification(t('app'),{body:t('scheduleChanged',{group:DATA.labels[state.group],n:items.length}),icon:'./icon-192.png',badge:'./icon-192.png',tag:'bashgau-schedule-'+state.group,data:{url:new URL('./',location.href).href}})}catch{}
}
let lastVersionCheck=0,versionChecking=false;
async function checkNewVersion(force=false){
 if(versionChecking||document.hidden||navigator.onLine===false||location.protocol==='file:'||(force!==true&&Date.now()-lastVersionCheck<60000)){renderFreshnessShortcut();return}
 versionChecking=true;lastVersionCheck=Date.now();renderFreshnessShortcut();
 const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),8000);
 try{
  const url=new URL('./index.html',location.href);url.searchParams.set('version-check',String(Date.now()));
  const response=await fetch(url,{cache:'no-store',signal:controller.signal});if(!response.ok)throw new Error('Publication unavailable');
  const source=await response.text(),version=source.match(/<meta name="app-version" content="([^"]+)"/);if(!version)throw new Error('Publication version missing');
  const order=compareRelease(version[1],APP_RELEASE);if(order===null)throw new Error('Invalid publication version');
  state.newVersion=order>0;state.publicationStatus=order>0?'new':order<0?'ahead':'current';state.publicationCheckedAt=new Date().toISOString();
  jsonSave('bash_publication_check_v1',{version:APP_RELEASE,checkedAt:state.publicationCheckedAt});renderUpdateBanner();
 }catch{state.publicationStatus='failed'}finally{versionChecking=false;clearTimeout(timeout);renderFreshnessShortcut()}
}
function reloadVersion(){location.reload()}
function initializeGestures(){
 const modal=$('modal'),panel=modal.querySelector('.panel'),body=$('modalBody');let drag=null,ignoreUntil=0;
 const clear=()=>{panel.style.removeProperty('transform');panel.style.removeProperty('transition');panel.style.removeProperty('animation');panel.style.removeProperty('--sheet-offset')};
 modal.addEventListener('touchstart',event=>{
  ignoreUntil=0;
  if(!matchMedia('(max-width:760px)').matches||event.touches.length!==1||event.target.closest('input,textarea,select')||!panel.contains(event.target))return;
  const touch=event.touches[0];drag={x:touch.clientX,y:touch.clientY,at:performance.now(),active:false,dy:0,eligible:!!event.target.closest('.sheet-grip,.panel-head')||body.scrollTop<=1};
 },{passive:true});
 modal.addEventListener('touchmove',event=>{
  if(!drag||event.touches.length!==1||!drag.eligible)return;
  const touch=event.touches[0],dx=touch.clientX-drag.x,dy=touch.clientY-drag.y;
  if(!drag.active){if(Math.abs(dx)>12&&Math.abs(dx)>Math.abs(dy)){drag=null;return}if(dy<-10){drag=null;return}if(dy<10||dy<Math.abs(dx)*1.3)return;drag.active=true;panel.style.animation='none';panel.style.transition='none'}
  drag.dy=Math.max(0,dy);if(event.cancelable)event.preventDefault();panel.style.transform=`translateY(${drag.dy*.9}px)`;
 },{passive:false});
 const finish=cancelled=>{
  if(!drag)return;const value=drag;drag=null;if(!value.active)return;
  ignoreUntil=performance.now()+350;const velocity=value.dy/Math.max(1,performance.now()-value.at);
  if(!cancelled&&(value.dy>90||(value.dy>45&&velocity>.5))){panel.style.setProperty('--sheet-offset',value.dy*.9+'px');panel.style.removeProperty('transform');panel.style.removeProperty('animation');closeModal();setTimeout(clear,260)}
  else{panel.style.transition=reducedMotion()?'none':'transform .3s cubic-bezier(.22,1,.36,1)';panel.style.transform='translateY(0)';setTimeout(clear,320)}
 };
 modal.addEventListener('touchend',()=>finish(false),{passive:true});modal.addEventListener('touchcancel',()=>finish(true),{passive:true});
 modal.addEventListener('click',event=>{if(performance.now()<ignoreUntil){event.preventDefault();event.stopImmediatePropagation()}},true);
 let swipe=null,surfaceIgnoreUntil=0;
 const surface=$('appShell');
 surface.addEventListener('touchstart',event=>{
  surfaceIgnoreUntil=0;
  if(event.touches.length!==1||!event.target.closest('.agenda,.day-nav')||event.target.closest('input,textarea,select,.subgroup-tools'))return;
  swipe={x:event.touches[0].clientX,y:event.touches[0].clientY,at:performance.now()};
 },{passive:true});
 surface.addEventListener('touchend',event=>{
  if(!swipe)return;const start=swipe;swipe=null;if(!event.changedTouches.length)return;
  const touch=event.changedTouches[0],dx=touch.clientX-start.x,dy=touch.clientY-start.y;
  if(performance.now()-start.at>1000||Math.abs(dx)<65||Math.abs(dx)<Math.abs(dy)*1.7)return;
  surfaceIgnoreUntil=performance.now()+350;moveDay(dx<0?1:-1);
 },{passive:true});
 surface.addEventListener('touchcancel',()=>{swipe=null},{passive:true});
 surface.addEventListener('click',event=>{if(performance.now()<surfaceIgnoreUntil){event.preventDefault();event.stopImmediatePropagation()}},true);
 $('dayNav').addEventListener('keydown',event=>{if(!['ArrowLeft','ArrowRight'].includes(event.key))return;event.preventDefault();moveDay(event.key==='ArrowRight'?1:-1);$('dayNav').querySelector('[aria-pressed="true"]')?.focus()});
}
function moveDay(direction){
 if(state.query){state.query='';$('lessonSearch').value=''}
 let day=state.day+direction,week=state.week;
 if(day>6){if(week>=MAX_WEEK)return;day=1;week++}else if(day<1){if(week<=1)return;day=6;week--}
 state.week=week;setDay(day);
}

function semesterDateRange(week){
 const f=new Intl.DateTimeFormat(LOCALES[state.lang],{day:'numeric',month:'short',timeZone:'UTC'});
 return f.format(dateOf(week,1))+' – '+f.format(dateOf(week,6));
}
function renderDaySummary(rows){
 let el=$('daySummary');if(!el){el=document.createElement('div');el.id='daySummary';el.className='day-summary';$('summaryCount').after(el)}
 el.hidden=!!state.query||!rows.length;if(el.hidden){el.innerHTML='';return}
 const slots=[...new Map(rows.map(r=>[r[9]+r[10],{start:toMinutes(r[9]),end:toMinutes(r[10])}])).values()].sort((a,b)=>a.start-b.start);
 let duration=0,end=0;for(const slot of slots){duration+=Math.max(0,slot.end-Math.max(slot.start,end));end=Math.max(end,slot.end)}
 const first=rows.reduce((a,b)=>toMinutes(a[9])<toMinutes(b[9])?a:b),last=rows.reduce((a,b)=>toMinutes(a[10])>toMinutes(b[10])?a:b);
 el.innerHTML=`<span>${esc(first[9])}–${esc(last[10])}</span><span>${esc(t('classMinutes',{n:duration}))}</span>`;
}
function lessonGap(rows,index){
 if(state.query||!index)return '';
 const row=rows[index],before=rows.slice(0,index).filter(x=>x[0]===row[0]);if(!before.length)return '';
 const end=Math.max(...before.map(x=>toMinutes(x[10]))),gap=toMinutes(row[9])-end;if(gap<10)return '';
 return `<div class="lesson-gap ${gap>=45?'long':''}">${uiIcon('clock')}<span>${esc(t(gap>=45?'freeWindow':'classBreak',{n:gap}))}</span></div>`;
}
function goToday(scrollToLesson=false){
 state.query='';$('lessonSearch').value='';state.week=currentWeek();state.day=Math.min(today(),6);state.openCard=-1;render(true);
 if(scrollToLesson)requestAnimationFrame(()=>{const card=$('cards').querySelector('.card.live')||$('cards').querySelector('.card');card?.scrollIntoView({behavior:reducedMotion()?'instant':'smooth',block:'center'})});
}
function nextTeachingDay(){
 const from=(state.week-1)*6+state.day;
 for(let slot=from;slot<MAX_WEEK*6;slot++){
  const week=Math.floor(slot/6)+1,day=slot%6+1;if(!matchingRows(week,day,'').length)continue;
  state.query='';$('lessonSearch').value='';state.week=week;state.day=day;state.openCard=-1;render(true);return;
 }
 toast(t('noFurtherLessons'));
}
function syncJumpToCurrent(){
 const el=$('jumpCurrent');if(!el)return;const c=ufaClock(),day=ufaDay(c),minute=c.hour*60+c.minute;
 const current=day?matchingRows(currentWeek(),day,'').find(r=>toMinutes(r[9])<=minute&&minute<toMinutes(r[10])):null;
 if(!current||state.modal||!$('onboard').hidden){el.hidden=true;return}
 const card=$('cards').querySelector('.card.live'),rect=card?.getBoundingClientRect();
 el.hidden=!!(rect&&rect.top>=0&&rect.top<innerHeight-180);el.textContent=t('jumpCurrent');
}
let jumpFrame=0;
window.addEventListener('scroll',()=>{if(!jumpFrame)jumpFrame=requestAnimationFrame(()=>{jumpFrame=0;syncJumpToCurrent()})},{passive:true});
function undoAppearance(){
 if(!state.appearanceAtOpen)return;
 state.appearance=normalizeAppearance(state.appearanceAtOpen);jsonSave('bash_appearance_v1',state.appearance);themeApply();renderAppearanceSettings();toast(t('appearanceUndone'));
}
function indicatorForPalette(indicator,icon,bg,saturation){
 const adjusted=contrastColor(saturateIndicator(indicator,saturation),bg,3);
 // Keep a grey indicator at 0%. For near-identical accents, pick a visibly different marker.
 if(saturation===0||Math.hypot(...rgbColor(adjusted).map((v,i)=>v-rgbColor(icon)[i]))>=85)return adjusted;
 return ['#ffb454','#53c7a1','#ec81b3','#6cafff'].map(c=>contrastColor(c,bg,3)).sort((a,b)=>Math.hypot(...rgbColor(b).map((v,i)=>v-rgbColor(icon)[i]))-Math.hypot(...rgbColor(a).map((v,i)=>v-rgbColor(icon)[i])))[0];
}
function compareRelease(a,b){
 const parse=value=>/^\d{4}-\d{2}-\d{2}(?:\.\d+)?$/.test(value)?value.split(/[-.]/).map(Number):null;
 const x=parse(a),y=parse(b);if(!x||!y)return null;
 for(let i=0;i<4;i++){if((x[i]||0)!==(y[i]||0))return (x[i]||0)>(y[i]||0)?1:-1}return 0;
}

const initialChanges=inspectScheduleChanges();
initializeGestures();
setInterval(checkNewVersion,300000);
if('serviceWorker' in navigator)navigator.serviceWorker.addEventListener('message',event=>{if(event.data?.type==='OPEN_SCHEDULE_CHANGES')openModal('updates')});
if(new URLSearchParams(location.search).get('changes')==='1'&&state.languageChosen){setTimeout(()=>openModal('updates'),350);history.replaceState(null,'',location.pathname+location.hash)}
window.addEventListener('online',()=>checkNewVersion(true));
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkNewVersion()});

const brandImage=$('brandIcon');brandImage.addEventListener('load',()=>{brandImage.hidden=false;$('brandFallback').hidden=true});brandImage.addEventListener('error',()=>{brandImage.hidden=true;$('brandFallback').hidden=false});brandImage.src='./icon.png';
render(true);
if(!state.languageChosen){$('onboardLanguages').innerHTML=languageChoices();$('onboard').hidden=false;syncOverlays()}
setupOffline();
checkNewVersion();
let lastScheduleMinute='',lastCalendarDay='',trackedWeek=currentWeek(),trackedDay=today();
function tick(){
 if(document.hidden)return;
 renderStatus();refreshTeacherLive();syncJumpToCurrent();const c=ufaClock(),calendar=`${c.year}-${c.month}-${c.day}`,stamp=`${calendar} ${c.hour}:${c.minute}`;
 if(lastCalendarDay&&calendar!==lastCalendarDay){if(state.week===trackedWeek&&state.day===Math.min(trackedDay,6)){state.week=currentWeek();state.day=Math.min(today(),6)}trackedWeek=currentWeek();trackedDay=today();render()}
 if(stamp!==lastScheduleMinute){lastScheduleMinute=stamp;if(document.activeElement?.id!=='noteText')renderCards()}
 lastCalendarDay=calendar;
}
setInterval(tick,1000);document.addEventListener('visibilitychange',()=>{document.body.classList.toggle('animations-paused',document.hidden);if(!document.hidden){tick();refreshOfflineHint()}});
