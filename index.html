<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Расписание 🌾 БашГАУ</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    
    :root { 
      --bg: #060e0a; 
      --surface: rgba(16, 35, 25, 0.65); 
      --surface-hover: rgba(22, 50, 35, 0.85);
      --border: rgba(16, 185, 129, 0.2); 
      --text: #f8fafc; 
      --text-muted: #94a3b8; 
      --accent: #f59e0b; 
      --accent-glow: rgba(245, 158, 11, 0.3);
      --prac: #10b981; 
      --lec: #fbbf24;
      --card-radius: 20px;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
    
    body { 
      background: var(--bg); color: var(--text); padding-bottom: 100px; overflow-x: hidden; 
      background-image: 
        radial-gradient(circle at top right, rgba(245, 158, 11, 0.1) 0%, transparent 40%), 
        radial-gradient(circle at bottom left, rgba(16, 185, 129, 0.1) 0%, transparent 50%);
      background-attachment: fixed;
    }
    
    .container { max-width: 600px; margin: 0 auto; padding: 16px; }
    
    .header-card { 
      background: linear-gradient(145deg, rgba(20, 40, 28, 0.8), rgba(6, 20, 10, 0.9)); 
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border); border-radius: var(--card-radius); padding: 20px; margin-bottom: 20px; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.5); position: relative; overflow: hidden;
    }
    .header-card::before {
        content: '🌾'; position: absolute; right: -10px; top: -10px; font-size: 6rem; opacity: 0.08; transform: rotate(15deg);
    }
    
    .header-title { font-size: 1.6rem; font-weight: 800; background: linear-gradient(90deg, #fde68a, #f59e0b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 4px; }
    .header-date { color: var(--text-muted); font-size: 0.9rem; font-weight: 500; margin-bottom: 18px; }
    
    /* Слайдеры */
    .segmented-control {
      display: flex; position: relative; background: rgba(0,0,0,0.4); border-radius: 12px; padding: 4px; margin-bottom: 12px;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .sc-slider {
      position: absolute; top: 4px; bottom: 4px; left: 4px;
      background: linear-gradient(90deg, #fcd34d, #f59e0b); border-radius: 8px; z-index: 1;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); box-shadow: 0 4px 15px var(--accent-glow);
    }
    .sc-slider.group-color { background: linear-gradient(90deg, #3b82f6, #60a5fa); box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3); }
    .sc-slider.sg-color { background: linear-gradient(90deg, var(--prac), #059669); box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); }
    
    .sc-tab {
      flex: 1; text-align: center; padding: 9px 0; font-weight: 600; font-size: 0.85rem; color: var(--text-muted);
      cursor: pointer; z-index: 2; transition: color 0.3s;
    }
    .sc-tab.active { color: #1e293b; font-weight: 700; text-shadow: 0 1px 2px rgba(255,255,255,0.3); }
    .sc-tab.group-active { color: #fff; font-weight: 700; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }
    .sc-tab.sg-active { color: #fff; font-weight: 700; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }

    .semester-progress { margin-bottom: 14px; }
    .sp-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 0.8rem; font-weight: 600; color: var(--text-muted); }
    .sp-title { color: #fde68a; font-weight: 700; }

    .live-radar { background: rgba(0,0,0,0.4); border-radius: 14px; padding: 14px; border: 1px solid rgba(245, 158, 11, 0.1); }
    .radar-status { display: flex; justify-content: space-between; align-items: center; font-weight: 600; margin-bottom: 10px; font-size: 0.85rem;}
    .radar-timer { font-variant-numeric: tabular-nums; color: #fcd34d; font-weight: 800; font-size: 1.15rem; text-shadow: 0 0 10px var(--accent-glow); }
    
    .progress-track { height: 6px; background: rgba(255,255,255,0.05); border-radius: 99px; overflow: hidden; }
    .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #f59e0b, #10b981); transition: width 0.5s ease-out; }
    
    /* Дни недели */
    .days-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-bottom: 20px; background: rgba(0, 0, 0, 0.3); backdrop-filter: blur(8px); padding: 6px; border-radius: 16px; border: 1px solid var(--border); }
    .day-btn { background: transparent; border-radius: 10px; padding: 10px 0; text-align: center; cursor: pointer; font-weight: 700; font-size: 0.85rem; color: var(--text-muted); transition: all 0.2s; }
    .day-btn.active { background: var(--prac); color: #fff; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); }
    
    @keyframes bounceIn {
      0% { opacity: 0; transform: translateY(15px) scale(0.98); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    
    .lessons-list { display: flex; flex-direction: column; gap: 12px; min-height: 200px; }
    .lesson-card { 
      background: var(--surface); backdrop-filter: blur(12px); border: 1px solid var(--border); 
      border-radius: var(--card-radius); padding: 15px; position: relative; overflow: hidden; cursor: pointer; 
      opacity: 0; animation: bounceIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    .lesson-card:hover { background: var(--surface-hover); }
    .lesson-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--accent); border-radius: 4px 0 0 4px; }
    .lesson-card.type-lec::before { background: var(--lec); box-shadow: 0 0 10px rgba(251, 191, 36, 0.5); }
    .lesson-card.type-prac::before { background: var(--prac); box-shadow: 0 0 10px rgba(16, 185, 129, 0.5); }
    .lesson-card.current { border-color: rgba(245, 158, 11, 0.4); background: linear-gradient(135deg, rgba(245, 158, 11, 0.1), var(--surface)); box-shadow: 0 8px 25px var(--accent-glow); }
    
    .card-main { display: grid; grid-template-columns: 58px 1fr; gap: 14px; align-items: flex-start; }
    .time-col { text-align: center; }
    .pair-num { font-size: 0.65rem; font-weight: 800; color: #fde68a; background: rgba(245, 158, 11, 0.15); padding: 2px 6px; border-radius: 6px; display: inline-block; margin-bottom: 4px; }
    .pair-time { font-size: 1.05rem; font-weight: 800; color: var(--text); letter-spacing: -0.5px;}
    .pair-end { font-size: 0.7rem; color: var(--text-muted); font-weight: 500;}
    
    .info-col { display: flex; flex-direction: column; width: 100%; }
    .subject-title { font-weight: 700; font-size: 1rem; display: block; margin-bottom: 6px; line-height: 1.3; }
    
    .badges-row { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
    .badge { font-size: 0.65rem; font-weight: 800; padding: 3px 7px; border-radius: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    .b-lec { background: rgba(251, 191, 36, 0.15); color: #fcd34d; border: 1px solid rgba(251, 191, 36, 0.3);}
    .b-prac { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3);}
    .b-week { background: rgba(255,255,255,0.08); color: #cbd5e1; border: 1px solid rgba(255,255,255,0.1); text-transform: none;}
    .b-sg { background: rgba(168,85,247,0.15); color: #c084fc; border: 1px solid rgba(168,85,247,0.3); }
    
    .room-row { display: flex; justify-content: space-between; align-items: center; }
    .room-badge { background: rgba(0,0,0,0.3); border: 1px solid var(--border); padding: 4px 9px; border-radius: 8px; font-weight: 700; font-size: 0.8rem; display: inline-flex; align-items: center; gap: 5px; color: #e2e8f0; }
    
    /* Аккордеон */
    .card-details { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); opacity: 0; }
    .lesson-card.expanded .card-details { grid-template-rows: 1fr; opacity: 1; margin-top: 12px; padding-top: 12px; border-top: 1px dashed rgba(255,255,255,0.1); }
    .details-inner { overflow: hidden; display: flex; flex-direction: column; gap: 8px; }
    
    .detail-item { display: flex; align-items: center; gap: 10px; font-size: 0.85rem; color: var(--text-muted); }
    .detail-icon { display: flex; justify-content: center; align-items: center; width: 30px; height: 30px; background: rgba(16, 185, 129, 0.1); color: #34d399; border-radius: 8px; font-size: 1rem; }
    .teacher-name { font-weight: 700; color: #fff; font-size: 0.9rem;}
    
    .chevron { transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); font-size: 0.75rem; color: var(--text-muted); width: 22px; height: 22px; display: flex; justify-content: center; align-items: center; background: rgba(255,255,255,0.05); border-radius: 50%;}
    .lesson-card.expanded .chevron { transform: rotate(180deg); color: var(--accent); background: rgba(245, 158, 11, 0.15);}
    
    .empty-state { text-align: center; padding: 50px 20px; color: var(--text-muted); background: var(--surface); border-radius: var(--card-radius); border: 1px dashed var(--border); }
    .emoji-lg { font-size: 3rem; margin-bottom: 12px; display: block; filter: drop-shadow(0 0 20px rgba(245, 158, 11, 0.3));}
    
    #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(150px); background: #064e3b; color: #fff; padding: 12px 24px; border-radius: 99px; font-weight: 700; font-size: 0.9rem; box-shadow: 0 10px 30px rgba(0,0,0,0.6); border: 1px solid #10b981; transition: 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); z-index: 1000; }
    #toast.show { transform: translateX(-50%) translateY(0); }
    
    .copy-btn { margin-top: 10px; padding: 14px; display: flex; justify-content: center; align-items: center; gap: 8px; background: linear-gradient(90deg, rgba(245, 158, 11, 0.15), rgba(16, 185, 129, 0.15)); border: 1px solid rgba(245, 158, 11, 0.3); color: #fff; border-radius: 14px; cursor: pointer; font-weight: 700; transition: 0.3s;}
    .copy-btn:active { transform: scale(0.96); }

    #clipboardFix { position: absolute; left: -9999px; top: -9999px; }
  </style>
</head>

          const tab = document.getElementById('tabSg' + i);
          if (i === sg) { tab.classList.add('sg-active'); } 
          else { tab.classList.remove('sg-active'); }
      });
      render(); upd();
  }
  
  function setD(d) { st.d = d; render(); }
  function toggleCard(elem) { elem.classList.toggle('expanded'); }
  
  // Умный фильтр
  function getFilteredLessons() {
      let curGroupData = ALL_DATA[st.grp] || ALL_DATA.AIP101;
      return curGroupData.filter(x => {
          if (x.d !== st.d) return false;
          if (st.sg !== 0 && x.sg !== 0 && x.sg !== st.sg) return false;
          
          // Оставляем только те недели, которые еще не прошли и совпадают по четности
          let activeFutureWeeks = x.ws.filter(w => w >= currentActualWeek && (w % 2 === 0 ? 2 : 1) === st.w);
          if (activeFutureWeeks.length === 0) return false;
          
          return true;
      }).sort((a,b)=>a.p-b.p);
  }
  
  // Копирование
  function copySchedule() {
      let l = getFilteredLessons();
      let grpName = st.grp === 'AIP101' ? 'АИП 101' : (st.grp === 'TOP101' ? 'ТОП 101' : 'ТОП 102');
      let text = `🌾 Расписание ${grpName} на ${DAYS[st.d-1]} (Неделя ${currentActualWeek}):\n\n`;
      if(!l.length) text += "Пар нет! Можно отдыхать 🎉\n";
      
      l.forEach(x => {
          let ttype = x.t === 'lec' ? 'Лек' : 'Прак';
          text += `⏳ ${x.p} пара (${BELLS[x.p].s}-${BELLS[x.p].e})\n📚 ${x.s} [${ttype}]\n🚪 Ауд: ${x.r}\n👤 ${x.tech || 'Не указан'}\n\n`;
      });
      
      let tf = document.getElementById("clipboardFix");
      tf.value = text;
      tf.select();
      tf.setSelectionRange(0, 99999);
      try {
          document.execCommand("copy");
          let toast = document.getElementById('toast');
          toast.classList.add('show');
          setTimeout(() => toast.classList.remove('show'), 2500);
      } catch (e) {
          alert("Не удалось скопировать.");
      }
  }
  
  function updateProgress() {
      let totalW = 17; 
      let pct = Math.round((currentActualWeek / totalW) * 100);
      if (pct > 100) pct = 100;
      document.getElementById('spText').innerText = `${currentActualWeek} из ${totalW} нед. (${pct}%)`;
      setTimeout(() => { document.getElementById('spFill').style.width = pct + '%'; }, 300);
  }
  
  function render() {
    document.getElementById('daysNav').innerHTML = DAYS.map((d,i) => 
      `<div class="day-btn ${st.d===i+1?'active':''}" onclick="setD(${i+1})">${d}</div>`
    ).join('');
    
    let l = getFilteredLessons();
    let delay = 0;
    
    document.getElementById('lesCont').innerHTML = l.length ? l.map(x => {
      delay += 0.05;
      return `
      <div class="lesson-card ${x.t==='lec'?'type-lec':'type-prac'}" onclick="toggleCard(this)" style="animation-delay: ${delay}s">
        <div class="card-main">
            <div class="time-col">
                <div class="pair-num">${x.p} ПАРА</div>
                <div class="pair-time">${BELLS[x.p].s}</div>
                <div class="pair-end">${BELLS[x.p].e}</div>
            </div>
            <div class="info-col">
              <span class="subject-title">${x.s}</span>
              <div class="badges-row">
                  <span class="badge ${x.t==='lec'?'b-lec':'b-prac'}">${x.t==='lec'?'Лекция':'Практика'}</span>
                  <span class="badge b-week">🕒 ${x.n}</span>
                  ${x.sg===1?`<span class="badge b-sg">1 ПГ</span>`:''}
                  ${x.sg===2?`<span class="badge b-sg">2 ПГ</span>`:''}
              </div>
              <div class="room-row">
                  <div class="room-badge">🚪 ${x.r}</div>
                  <div class="chevron">▼</div>
              </div>
            </div>
        </div>
        <div class="card-details">
            <div class="details-inner">
                <div class="detail-item">
                    <div class="detail-icon">👨‍🏫</div>
                    <div>
                        <div style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 2px;">Преподаватель</div>
                        <div class="teacher-name">${x.tech || 'Не назначен'}</div>
                    </div>
                </div>
            </div>
        </div>
      </div>
    `}).join('') : `
        <div class="empty-state">
            <span class="emoji-lg">🌾</span>
            <h3 style="color: var(--text); margin-bottom: 8px;">В этот день пар нет</h3>
            <p>Пар нет. Отдыхаем!</p>
        </div>
    `;
    
    if(l.length) {
        document.getElementById('lesCont').innerHTML += `
            <div class="copy-btn" onclick="copySchedule()">
                📋 Скопировать расписание на день
            </div>
        `;
    }
  }
  
  function toM(s) { let p=s.split(':'); return p[0]*60 + +p[1]; }
  
  function upd() {
    let n = new Date();
    const options = { weekday: 'long', month: 'long', day: 'numeric' };
    let dateStr = n.toLocaleDateString('ru-RU', options);
    document.getElementById('curDate').innerText = dateStr.charAt(0).toUpperCase() + dateStr.slice(1) + ` (Нед: ${currentActualWeek})`;
    
    let actW = currentActualWeek % 2 === 0 ? 2 : 1;
    let actD = n.getDay() || 7;
    
    let curGroupData = ALL_DATA[st.grp] || ALL_DATA.AIP101;
    let l = curGroupData.filter(x => {
        if (x.d !== actD) return false;
        if (st.sg !== 0 && x.sg !== 0 && x.sg !== st.sg) return false;
        if (!x.ws.includes(currentActualWeek)) return false;
        return true;
    }).sort((a,b)=>a.p-b.p);
    
    let sEl = document.getElementById('rStatus'), tEl = document.getElementById('rTimer'), pEl = document.getElementById('rProg');
    document.querySelectorAll('.lesson-card').forEach(c => c.classList.remove('current'));
    
    if(!l.length || actD !== st.d || actW !== st.w) { 
        sEl.innerText = 'Пар нет. Свобода!'; tEl.innerText = '--:--'; pEl.style.width = '100%'; 
        return; 
    }
    
    let nm = n.getHours()*60 + n.getMinutes();
    for(let i=0; i<l.length; i++) {
      let x = l[i], b = BELLS[x.p], sm = toM(b.s), em = toM(b.e);
      if(nm < sm) {
        sEl.innerText = `До пары: ${x.s}`;
        tEl.innerText = `${Math.floor((sm-nm)/60)}:${String((sm-nm)%60).padStart(2,'0')}`;
        pEl.style.width = '0%'; return;
      }
      if(nm >= sm && nm < em) {
        sEl.innerText = `Идет ${x.p} пара`;
        tEl.innerText = `${Math.floor((em-nm)/60)}:${String((em-nm)%60).padStart(2,'0')}`;
        pEl.style.width = `${Math.round(((nm-sm)/(em-sm))*100)}%`;
        if(st.d === actD) {
           let cards = document.querySelectorAll('.lesson-card');
           if(cards[i]) cards[i].classList.add('current');
        }
        return;
      }
    }
    sEl.innerText = 'Все пары на сегодня закончились ✅'; tEl.innerText = '--:--'; pEl.style.width = '100%';
  }
  
  // Инициализация при старте
  setGroup(st.grp);
  setW(st.w);
  setSg(st.sg);
  updateProgress();
  setInterval(upd, 1000);
</script>
</body>
</html>
